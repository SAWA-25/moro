


<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Moro</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#f4f2ed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Moro" />
    
    <!-- Updated Icons -->
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />

    <!-- KaTeX CSS for Math Rendering -->
    <link rel="stylesheet" href="https://unpkg.com/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600&family=Nunito:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&family=DM+Serif+Display:ital@0;1&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600;1,700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Caveat:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Ma+Shan+Zheng&family=Long+Cang&family=ZCOOL+KuaiLe&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['var(--app-font)', 'sans-serif'],
              display: ['var(--font-display)', 'serif'],
              label: ['var(--font-label)', 'monospace'],
            },
            colors: {
              primary: 'hsl(var(--primary-hue), var(--primary-sat), var(--primary-lightness))',
              'primary-focus': 'hsl(var(--primary-hue), var(--primary-sat), calc(var(--primary-lightness) - 10%))',
              'primary-light': 'hsl(var(--primary-hue), var(--primary-sat), 92%)',
              surface: 'rgba(255, 255, 255, 0.75)',
              'surface-glass': 'rgba(255, 255, 255, 0.35)',
              ink: '#2b2933',
              'ink-soft': '#8b8996',
            },
            animation: {
              'fade-in': 'fadeIn 0.35s cubic-bezier(0.4, 0, 0.2, 1)',
              'slide-up': 'slideUp 0.35s cubic-bezier(0.25, 1, 0.5, 1)',
              'slide-down': 'slideDown 0.35s cubic-bezier(0.25, 1, 0.5, 1)',
              'pop-in': 'popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
              'deal-in': 'dealIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both',
              'float-up': 'floatUp 3s ease-out forwards',
              'wiggle': 'wiggle 0.5s ease-in-out infinite',
              'bounce-slow': 'bounceSlow 2s ease-in-out infinite',
              'float': 'floatDrift 4s ease-in-out infinite alternate',
              'glow-pulse': 'glowPulse 3s ease-in-out infinite',
              'shimmer': 'shimmer 2.5s ease-in-out infinite',
              'dot-pulse': 'dotPulse 1.2s ease-in-out infinite',
              'breathe': 'breathe 5s ease-in-out infinite',
              'drift-slow': 'driftSlow 18s ease-in-out infinite alternate',
              'drift-slower': 'driftSlow 26s ease-in-out infinite alternate-reverse',
              'sway': 'sway 6s ease-in-out infinite alternate',
              'rise-in': 'riseIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both',
              'tarot-shine': 'tarotShine 1.05s ease-out',
              'tarot-glow': 'tarotGlow 3.6s ease-in-out infinite',
              'tarot-bob': 'tarotBob 4.8s ease-in-out infinite',
              'tarot-sheen': 'tarotSheen 3.2s ease-in-out infinite',
              'tarot-twinkle': 'tarotTwinkle 2.4s ease-in-out infinite',
              'tarot-float': 'tarotFloat 5.5s ease-in-out infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'scale(0.97) translateY(4px)' },
                '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
              },
              slideUp: {
                '0%': { transform: 'translateY(100%)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              slideDown: {
                '0%': { transform: 'translateY(-100%)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              popIn: {
                '0%': { opacity: '0', transform: 'scale(0.5)' },
                '60%': { transform: 'scale(1.05)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              dealIn: {
                '0%': { opacity: '0', transform: 'translateY(46px) scale(0.62) rotate(-9deg)' },
                '65%': { opacity: '1', transform: 'translateY(-4px) scale(1.04) rotate(2deg)' },
                '100%': { opacity: '1', transform: 'translateY(0) scale(1) rotate(0)' },
              },
              floatUp: {
                '0%': { opacity: '1', transform: 'translateY(100vh) scale(1)' },
                '50%': { opacity: '1' },
                '100%': { opacity: '0', transform: 'translateY(-50px) scale(1.5)' },
              },
              wiggle: {
                '0%, 100%': { transform: 'translate(-50%, -100%) rotate(-3deg)' },
                '50%': { transform: 'translate(-50%, -100%) rotate(3deg)' },
              },
              bounceSlow: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              floatDrift: {
                '0%': { transform: 'translateY(0) scale(1)', opacity: '0.3' },
                '100%': { transform: 'translateY(-30px) scale(1.1)', opacity: '0.6' },
              },
              glowPulse: {
                '0%, 100%': { boxShadow: '0 0 15px rgba(139, 92, 246, 0.15)' },
                '50%': { boxShadow: '0 0 25px rgba(139, 92, 246, 0.3)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              },
              dotPulse: {
                '0%, 80%, 100%': { opacity: '0.3', transform: 'scale(0.8)' },
                '40%': { opacity: '1', transform: 'scale(1.1)' },
              },
              breathe: {
                '0%, 100%': { transform: 'scale(1)', opacity: '0.55' },
                '50%': { transform: 'scale(1.06)', opacity: '0.85' },
              },
              driftSlow: {
                '0%': { transform: 'translate(0, 0) scale(1)' },
                '100%': { transform: 'translate(28px, -22px) scale(1.12)' },
              },
              sway: {
                '0%': { transform: 'rotate(-2.2deg)' },
                '100%': { transform: 'rotate(2.2deg)' },
              },
              riseIn: {
                '0%': { opacity: '0', transform: 'translateY(14px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              tarotShine: {
                '0%': { transform: 'translateX(-130%) skewX(-12deg)', opacity: '0' },
                '12%': { opacity: '0.85' },
                '60%, 100%': { transform: 'translateX(230%) skewX(-12deg)', opacity: '0' },
              },
              tarotGlow: {
                '0%, 100%': { opacity: '0.3', transform: 'scale(0.94)' },
                '50%': { opacity: '0.68', transform: 'scale(1.05)' },
              },
              tarotBob: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-5px)' },
              },
              // 抽牌·正中聚焦那张：一道高光循环扫过，强化「这张在发光」的实体占卜质感（仿 Quin）
              tarotSheen: {
                '0%': { transform: 'translateX(-130%) skewX(-14deg)', opacity: '0' },
                '18%': { opacity: '0.55' },
                '50%, 100%': { transform: 'translateX(240%) skewX(-14deg)', opacity: '0' },
              },
              // 洗牌花上的星芒：缓慢明灭 + 轻微缩放，让牌堆看起来在呼吸
              tarotTwinkle: {
                '0%, 100%': { opacity: '0.15', transform: 'scale(0.7)' },
                '50%': { opacity: '0.9', transform: 'scale(1.15)' },
              },
              // 聚焦牌的轻盈上下浮动（比 tarotBob 幅度大些，单张用）
              tarotFloat: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-8px)' },
              },
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --primary-hue: 248;
        --primary-sat: 16%;
        --primary-lightness: 36%;
        /* 安全区单一来源：原生 env 与 JS 探测值 --standalone-safe-area-*（见 utils/iosStandalone.ts）取大，
           iOS 全屏 PWA 下原生 env 偶发返回 0 时由探测值兜底。新增 App 一律引用这三个变量。 */
        --safe-top: max(env(safe-area-inset-top, 0px), var(--standalone-safe-area-top, 0px));
        --safe-bottom: max(env(safe-area-inset-bottom, 0px), var(--standalone-safe-area-bottom, 0px));
        /* 全屏界面顶栏让开「安全区 + Moro 顶部状态栏(时间/电量, 约 1.5rem)」；背景仍铺满，只挪控件。 */
        --chrome-top: calc(var(--safe-top) + 1.5rem);
        --app-height: 100lvh;
        --keyboard-inset: 0px;
        --app-font: 'Quicksand', 'Noto Sans SC', sans-serif;
        /* 编辑部纸感设计 token：衬线斜体大字（时钟/标题）+ 等宽字母间距小标签 */
        --font-display: 'Playfair Display', 'DM Serif Display', 'Shippori Mincho', serif;
        --font-label: 'Space Mono', 'Courier Prime', monospace;
        --ink: #2b2933;
        --ink-soft: #8b8996;
        --paper: #fbfaf7;
        /* 手帐拼贴风手写字（桌面组件 Music / Focus / Notes 式小标签） */
        --font-hand: 'Caveat', 'Quicksand', cursive;
        /* 新默认：奶白拼贴卡片 —— 近不透明白 + 米灰细描边 + 更软的投影（参照黑白手帐桌面） */
        --glass-bg: rgba(255, 255, 255, 0.88);
        --glass-border: rgba(236, 233, 226, 0.9);
        --glass-shadow: 0 16px 36px -20px rgba(50, 48, 60, 0.22);
      }
      html, body, #root {
        width: 100%;
        min-height: var(--app-height, 100lvh);
        height: var(--app-height, 100lvh);
      }
      body {
        background-color: #f4f2ed;
        margin: 0;
        overflow: hidden;
        /* Critical: Prevent browser back/forward swipe navigation AND vertical rubber-banding */
        overscroll-behavior: none;
        /* Prevent text selection to feel like an app */
        user-select: none;
        -webkit-user-select: none;
        height: var(--app-height);
        min-height: var(--app-height);
        width: 100vw;
        font-family: var(--app-font);
      }
      body.ios-standalone {
        min-height: var(--app-height);
        height: var(--app-height);
        overscroll-behavior-y: auto;
        overscroll-behavior-x: none;
      }
      body.ios-standalone #root {
        min-height: var(--app-height);
        height: var(--app-height);
      }
      /* Global scroll behavior fix */
      .no-overscroll {
        overscroll-behavior: none;
      }
      .overscroll-contain {
        overscroll-behavior: contain;
      }
      /* Re-enable selection for inputs */
      input, textarea {
        user-select: text;
        -webkit-user-select: text;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* 阅读器细滚动条（明暗主题通用，半透明） */
      .vr-reader-scroll {
        scrollbar-width: thin;
        scrollbar-color: rgba(140,140,140,0.35) transparent;
      }
      .vr-reader-scroll::-webkit-scrollbar {
        width: 5px;
      }
      .vr-reader-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .vr-reader-scroll::-webkit-scrollbar-thumb {
        background: rgba(140,140,140,0.35);
        border-radius: 999px;
      }
      .vr-reader-scroll::-webkit-scrollbar-thumb:hover {
        background: rgba(140,140,140,0.55);
      }
      input:focus, textarea:focus, select:focus {
        outline: none;
      }
      /* Utility for Safe Area —— 统一引用单一来源变量 */
      .pb-safe {
        padding-bottom: var(--safe-bottom);
      }
      /* ===== 默认全局美化：纸感毛玻璃设计系统 =====
         .glass-card / .glass-pill 是全局通用的毛玻璃表面；各 App 直接套用以保持一致观感。 */
      .glass-card {
        background: var(--glass-bg);
        backdrop-filter: blur(20px) saturate(1.5);
        -webkit-backdrop-filter: blur(20px) saturate(1.5);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-shadow);
      }
      .glass-pill {
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(16px) saturate(1.4);
        -webkit-backdrop-filter: blur(16px) saturate(1.4);
        border: 1px solid rgba(236, 233, 226, 0.9);
        box-shadow: 0 14px 32px -16px rgba(50, 48, 60, 0.26);
      }
      /* 手写体小标签（桌面组件英文标注） */
      .font-hand {
        font-family: var(--font-hand);
      }
      /* 等宽字母间距小标签（MEMORY BOARD / PALETTE 式） */
      .label-mono {
        font-family: var(--font-label);
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      /* 衬线斜体展示字（时钟大数字 / 卡片标题） */
      .font-display-italic {
        font-family: var(--font-display);
        font-style: italic;
      }
      /* ===== 手账拼贴（Scrapbook Collage）全局层 =====
         作用于全系统共用表面：glass-card / glass-pill / moro-app-tile / 桌面小组件钩子类。
         所有 App 不需要各自改动即可获得统一的手账拼贴质感。 */
      /* 纸卡点纹：给所有 glass-card 叠一层极淡的手帐内页点纹 */
      .glass-card {
        background-image: radial-gradient(circle at 1px 1px, rgba(120, 116, 106, 0.07) 1px, transparent 0);
        background-size: 14px 14px;
      }
      /* 缝线描边：glass-pill（dock 等胶囊面）内圈一道虚线，像手缝在纸页上 */
      .glass-pill {
        outline: 1.5px dashed rgba(167, 162, 151, 0.38);
        outline-offset: -7px;
      }
      /* App 图标贴纸缝线：每个图标瓦片内圈细虚线（贴纸车线感） */
      .moro-app-tile {
        outline: 1px dashed rgba(167, 162, 151, 0.32);
        outline-offset: -4px;
      }
      /* 拼贴微旋转：桌面图标隔几个轻微歪一点，像随手贴上去的贴纸 */
      [data-desk-item]:nth-child(5n + 2) .moro-app-tile { rotate: -1.5deg; }
      [data-desk-item]:nth-child(5n + 4) .moro-app-tile { rotate: 1.4deg; }
      [data-desk-item]:nth-child(7n + 3) .moro-app-tile { rotate: 0.8deg; }
      /* 和纸胶带：贴在桌面小组件卡片上缘的半透明胶带条（盖过圆角，拼贴感主角） */
      .moro-widget-clock::after,
      .moro-widget-character::after,
      .moro-widget-schedule::after,
      .moro-widget-weather::after,
      .moro-widget-music::after {
        content: '';
        position: absolute;
        top: -6px;
        left: 50%;
        width: 72px;
        height: 20px;
        transform: translateX(-50%) rotate(-2.5deg);
        background: linear-gradient(100deg, rgba(255, 255, 255, 0.6), rgba(243, 240, 233, 0.45));
        box-shadow: 0 2px 6px rgba(50, 48, 60, 0.14);
        border-left: 1px dashed rgba(160, 156, 146, 0.45);
        border-right: 1px dashed rgba(160, 156, 146, 0.45);
        backdrop-filter: blur(1px);
        -webkit-backdrop-filter: blur(1px);
        z-index: 6;
        pointer-events: none;
      }
      .moro-widget-music::after { transform: translateX(-50%) rotate(2.5deg); width: 58px; }
      .moro-widget-weather::after { transform: translateX(-50%) rotate(2deg); width: 52px; }
      .moro-widget-schedule::after { transform: translateX(-50%) rotate(1.8deg); }
      /* 蕾丝花边条：手帐页眉装饰（repeat-x 扇贝形），供桌面 / App 页眉使用 */
      .lace-edge {
        height: 10px;
        background-image:
          radial-gradient(circle at 8px -2px, transparent 6px, rgba(255, 255, 255, 0.85) 6.5px, rgba(255, 255, 255, 0.85) 8.5px, transparent 9px);
        background-size: 16px 10px;
        background-repeat: repeat-x;
      }
      /* 手帐贴纸按钮：墨色实底 + 缝线 + 贴纸投影（按键统一风格，供各 App 使用） */
      .scrap-btn {
        background: #2b2933;
        color: #ffffff;
        border-radius: 9999px;
        outline: 1px dashed rgba(255, 255, 255, 0.35);
        outline-offset: -4px;
        box-shadow: 0 12px 24px -12px rgba(43, 41, 51, 0.55);
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .scrap-btn:active { transform: scale(0.96); }
      .scrap-btn-paper {
        background: rgba(255, 255, 255, 0.92);
        color: #2b2933;
        border: 1px solid rgba(236, 233, 226, 0.9);
        border-radius: 9999px;
        outline: 1px dashed rgba(167, 162, 151, 0.4);
        outline-offset: -4px;
        box-shadow: 0 10px 22px -14px rgba(50, 48, 60, 0.4);
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .scrap-btn-paper:active { transform: scale(0.96); }
      /* 拼贴微旋转工具类（卡片 / 贴图随手用） */
      .tilt-l { rotate: -1.6deg; }
      .tilt-r { rotate: 1.4deg; }
      /* ===== 加号面板贴纸瓦片（聊天 + 面板 / 各功能格） ===== */
      /* 纸面板底：极淡点纹，像手帐内页 */
      .scrap-panel {
        background-image: radial-gradient(circle at 1px 1px, rgba(120, 116, 106, 0.08) 1px, transparent 0);
        background-size: 14px 14px;
      }
      /* 纸贴纸瓦片：白纸面 + 缝线 + 贴纸投影 */
      .scrap-tile {
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid rgba(236, 233, 226, 0.95);
        outline: 1px dashed rgba(167, 162, 151, 0.4);
        outline-offset: -4px;
        box-shadow: 0 10px 20px -12px rgba(50, 48, 60, 0.35);
        color: #2b2933;
      }
      /* 迷你和纸胶带：贴在瓦片上缘 */
      .scrap-tile::after {
        content: '';
        position: absolute;
        top: -5px;
        left: 50%;
        width: 30px;
        height: 10px;
        transform: translateX(-50%) rotate(-3deg);
        background: linear-gradient(100deg, rgba(255, 255, 255, 0.65), rgba(243, 240, 233, 0.5));
        border-left: 1px dashed rgba(160, 156, 146, 0.4);
        border-right: 1px dashed rgba(160, 156, 146, 0.4);
        box-shadow: 0 1px 3px rgba(50, 48, 60, 0.12);
        pointer-events: none;
      }
      /* 激活态：墨色实底贴纸 */
      .scrap-tile-ink {
        background: #2b2933;
        border-color: #2b2933;
        outline-color: rgba(255, 255, 255, 0.35);
        color: #ffffff;
      }
      /* 深色聊天框（discord 输入风格）下的瓦片 */
      .scrap-tile-dark {
        background: rgba(30, 41, 59, 0.92);
        border-color: rgba(255, 255, 255, 0.08);
        outline-color: rgba(255, 255, 255, 0.22);
        color: #e2e8f0;
      }
      /* 瓦片交错微旋转：随手贴上去的感觉 */
      .scrap-action:nth-child(4n + 2) .scrap-tile { rotate: -2deg; }
      .scrap-action:nth-child(4n + 3) .scrap-tile { rotate: 1.6deg; }
      .scrap-action:nth-child(4n) .scrap-tile { rotate: -1deg; }
      /* ===== 絮语 · 文具盒纸条（聊天底部功能面板重构版） ===== */
      /* 横向纸条按钮：白纸面 + 左缘竖贴和纸胶带 + 缝线，图标在左、文案在右 */
      .stationery-strip {
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid rgba(236, 233, 226, 0.95);
        border-radius: 14px;
        box-shadow: 0 8px 18px -12px rgba(50, 48, 60, 0.35);
        padding: 9px 11px;
        position: relative;
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .stationery-strip:active { transform: scale(0.97); }
      .stationery-strip::before {
        content: '';
        position: absolute;
        left: -4px;
        top: 50%;
        height: 24px;
        width: 9px;
        transform: translateY(-50%) rotate(2deg);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.7), rgba(243, 240, 233, 0.55));
        border-top: 1px dashed rgba(160, 156, 146, 0.4);
        border-bottom: 1px dashed rgba(160, 156, 146, 0.4);
        box-shadow: 0 1px 2px rgba(50, 48, 60, 0.12);
        pointer-events: none;
      }
      /* 邮票形图标格：米纸底 + 内圈虚线（齿孔感） */
      .stamp-box {
        width: 34px;
        height: 34px;
        flex-shrink: 0;
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f4ef;
        color: #2b2933;
        outline: 1px dashed rgba(120, 116, 106, 0.5);
        outline-offset: -3px;
      }
      /* 墨色实底纸条（开启态 / 特殊通道） */
      .stationery-strip-ink {
        background: #2b2933;
        border-color: #2b2933;
        color: #ffffff;
      }
      .stationery-strip-ink .stamp-box {
        background: rgba(255, 255, 255, 0.12);
        color: #ffffff;
        outline-color: rgba(255, 255, 255, 0.4);
      }
      /* 深色聊天框（discord 输入风格）下的纸条 */
      .stationery-strip-dark {
        background: rgba(30, 41, 59, 0.92);
        border-color: rgba(255, 255, 255, 0.08);
        color: #e2e8f0;
      }
      .stationery-strip-dark .stamp-box {
        background: rgba(255, 255, 255, 0.08);
        color: #e2e8f0;
        outline-color: rgba(255, 255, 255, 0.25);
      }
      /* 火漆点：功能开启中的状态标记 */
      .wax-dot {
        width: 10px;
        height: 10px;
        border-radius: 9999px;
        flex-shrink: 0;
        background: radial-gradient(circle at 35% 30%, #d8625b, #b03a34);
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9), 0 2px 5px rgba(176, 58, 52, 0.5);
      }
      /* 分区标签：墨色小旗 + 右侧延伸缝线 */
      .drawer-tag {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .drawer-tag > span {
        background: #2b2933;
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.18em;
        padding: 3px 10px;
        border-radius: 4px 10px 10px 4px;
        rotate: -1deg;
      }
      .drawer-tag::after {
        content: '';
        flex: 1;
        border-top: 1px dashed rgba(160, 156, 146, 0.5);
      }
      /* 纸条交错微旋转：随手摆进抽屉的感觉 */
      .stationery-grid > .stationery-strip:nth-child(odd) { rotate: -0.7deg; }
      .stationery-grid > .stationery-strip:nth-child(even) { rotate: 0.55deg; }
      /* 灵动岛通知胶囊：墨色底上加一圈手缝虚线（与 scrap-btn 一致的贴纸车线感）。
         用户的 dynamicIslandStyle.customCss 仍可覆盖（同 .moro-dynamic-island 钩子） */
      .moro-dynamic-island {
        outline: 1px dashed rgba(255, 255, 255, 0.28);
        outline-offset: -5px;
      }
      /* 纸贴卡片：聊天列表 / 联系人等行卡片的贴纸面（白纸 + 缝线 + 软投影） */
      .scrap-card {
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid rgba(236, 233, 226, 0.95);
        outline: 1px dashed rgba(167, 162, 151, 0.32);
        outline-offset: -5px;
        box-shadow: 0 10px 22px -16px rgba(50, 48, 60, 0.3);
      }
      /* 列表卡片交错微旋转（拼贴感，幅度比图标更轻） */
      .scrap-list > .scrap-card:nth-child(5n + 2) { rotate: -0.6deg; }
      .scrap-list > .scrap-card:nth-child(5n + 4) { rotate: 0.5deg; }
      /* 治愈系微交互：卡片按压回弹 + 悬浮轻抬 */
      .press-soft {
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
      }
      .press-soft:active {
        transform: scale(0.97);
      }
      @media (hover: hover) {
        .press-soft:hover {
          transform: translateY(-2px);
          box-shadow: 0 22px 48px -18px rgba(63, 61, 86, 0.26);
        }
        .press-soft:hover:active {
          transform: scale(0.97);
        }
      }

      /* ===== Moro desktop refresh ===== */

          linear-gradient(135deg, transparent 0 28%, rgba(255,255,255,0.46) 28% 29%, transparent 29% 62%, rgba(144,181,210,0.12) 62% 63%, transparent 63%),

      /* ── 来往·入场/微交互动效（纯 CSS，避开 CDN Tailwind 自定义 animate-* 的不确定性）── */
      /* 列表行逐行轻起：上浮 + 极轻缩放 + 淡入（配合行内 animationDelay 做错峰）。
         只动 transform/opacity；与 .scrap-card 的 nth-child rotate 用的是独立 rotate 属性、互不打架。 */
      @keyframes moroRowIn { from { opacity: 0; transform: translateY(11px) scale(0.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
      .anim-row-in { animation: moroRowIn 0.44s cubic-bezier(0.22, 1, 0.36, 1) both; }
      /* 顶栏/区块落入：自上而下轻落 + 淡入。 */
      @keyframes moroDropIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
      .anim-drop-in { animation: moroDropIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
      /* 浮起淡入（用于聊天信息区在登场过场后柔和接续）。 */
      @keyframes moroFloatIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
      .anim-float-in { animation: moroFloatIn 0.52s cubic-bezier(0.22, 1, 0.36, 1) both; }
      /* 头像登场：轻微回弹缩放（治愈系 overshoot）。 */
      @keyframes moroAvatarPop { 0% { opacity: 0; transform: scale(0.6); } 70% { opacity: 1; transform: scale(1.08); } 100% { opacity: 1; transform: scale(1); } }
      .anim-avatar-pop { animation: moroAvatarPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      /* 徽标/数字弹入。 */
      @keyframes moroPop { 0% { opacity: 0; transform: scale(0.4); } 60% { transform: scale(1.15); } 100% { opacity: 1; transform: scale(1); } }
      .anim-pop { animation: moroPop 0.34s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      /* 底部导航：选中态滑动指示条（在按钮内绝对定位，靠 left/width 过渡平滑滑动）。 */
      .moro-tabbar { position: relative; }
      .moro-tab-ink {
        position: absolute; top: 0; height: 2.5px; border-radius: 9999px;
        background: linear-gradient(90deg, transparent, currentColor, transparent);

        pointer-events: none;

      }
      .ig-ring > img { border: 2px solid #fff; }

      /* ════════════════ Moro · Ins 风 + 拍立得 设计层（全局换肤新基调）════════════════
         告别「黑白拼贴手账」的网点纸纹 / 牛皮胶带 / 虚线缝线，转向「照片当主角」的清爽暖白：
         纯白卡片 + 大圆角 + 极柔投影 + 彩色 IG 故事环 + 拍立得显影动画。
         这一层只提供全局动画与少量工具类；具体积木在 components/ui/insKit.tsx，各 App 逐一换肤时取用。
         注意：不删旧手账 CSS——尚未换肤的 App 仍依赖它，迁移完再清。 */

      /* 拍立得「显影」：照片从泛白欠曝缓缓显影到正常，配合轻微上浮——像刚摇出来的拍立得 */
      @keyframes polaroidDevelop {
        0%   { filter: contrast(0.7) brightness(1.32) saturate(0.4); opacity: 0; transform: translateY(10px) scale(0.98) rotate(var(--pl-rot, 0deg)); }
        45%  { opacity: 1; }
        100% { filter: contrast(1.02) brightness(1) saturate(1); opacity: 1; transform: translateY(0) scale(1) rotate(var(--pl-rot, 0deg)); }
      }
      .animate-develop { animation: polaroidDevelop 1.1s cubic-bezier(0.22, 1, 0.36, 1) both; }
      /* 仅照片显影（容器不动，用于网格图） */
      @keyframes photoDevelop {
        0%   { filter: contrast(0.7) brightness(1.3) saturate(0.45); opacity: 0; }
        100% { filter: contrast(1.02) brightness(1) saturate(1); opacity: 1; }
      }
      .animate-photo-develop { animation: photoDevelop 0.9s ease-out both; }

      /* 轻柔漂浮（贴纸 / 装饰元素用） */
      @keyframes floatSoft {
        0%, 100% { transform: translateY(0) rotate(var(--fl-rot, 0deg)); }
        50%      { transform: translateY(-7px) rotate(var(--fl-rot, 0deg)); }
      }
      .animate-float-soft { animation: floatSoft 4.5s ease-in-out infinite; }

      /* 卡片入场：放大淡入 + 轻微上浮（比 fade-in 更有「咔哒贴上」的质感） */
      @keyframes insCardIn { from { opacity: 0; transform: translateY(16px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
      .animate-ins-card { animation: insCardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }

      /* 淡玫瑰故事环（拍立得/ins 基调的活跃描边）：克制低饱和，缓慢旋转 */
      @keyframes insRingSpin { to { transform: rotate(360deg); } }
      .ins-ring {
        position: relative; display: inline-flex; padding: 2.5px; border-radius: 9999px; isolation: isolate;
      }
      .ins-ring::before {
        content: ''; position: absolute; inset: 0; border-radius: inherit; z-index: -1;
        background: conic-gradient(from 0deg, #fff4f7, #ead5df, #d8a5b7, #c98ca3, #f7e6ed, #fff4f7);
        animation: insRingSpin 6s linear infinite;
      }
      .ins-ring > img, .ins-ring > div { border: 2.5px solid #fff; }
      /* 静态彩环（不旋转，列表里成片出现时更克制） */
      .ins-ring-static::before { animation: none; }

      /* 清爽白卡（工具类版，等价 insKit 的 InsCard；供散用） */
      .ins-card {
        background: #ffffff;
        border: 1px solid rgba(0,0,0,0.05);
        border-radius: 22px;
        box-shadow: 0 1px 2px rgba(38,38,38,0.04), 0 18px 40px -28px rgba(38,38,38,0.30);
      }
      /* 暖白画布底（App 外壳） */
      .ins-canvas { background: #f7f5f2; }

      /* 渐变文字（淡玫瑰，用于点睛标题） */
      .ins-gradient-text {
        background: linear-gradient(120deg, #ead5df, #d8a5b7 45%, #c98ca3 80%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; color: transparent;
      }
